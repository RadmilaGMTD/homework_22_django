<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Управление сайтом{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">

</head>
<body>
<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 mr-md-auto font-weight-normal">SpeakEasy</h5>
    <nav class="ms-5">
        <a class="p-2 btn btn-outline-primary" href="/">Каталог</a>
        <a class="p-2 btn btn-outline-primary" href="/contacts/">Контакты</a>
        <a class="p-2 btn btn-outline-primary" href="/user_materials/">Ваши материалы</a>
    </nav>
</div>
<div class="container">
  {% block content %}{% endblock %}
  </div>
    <footer class="pt-4 my-md-5 pt-md-5 mx-5 border-top">
        <div class="row">
            <div class="col-12 col-md">
                SpeakEasy
                <small class="d-block mb-3 text-muted">&copy; 2023</small>
            </div>
            <div class="col-6 col-md">
                <h5>Сотрудничество</h5>
                <ul class="list-unstyled text-small">
                    <li><a class="text-muted" href="#">Скидки для друзей</a></li>
                    <li><a class="text-muted" href="#">Партнерская программа</a></li>
                </ul>
            </div>
            <div class="col-6 col-md">
                <h5>Дополнительно</h5>
                <ul class="list-unstyled text-small">
                    <li><a class="text-muted" href="#">Мы пишем</a></li>
                </ul>
            </div>
            <div class="col-6 col-md">
                <h5>О нас</h5>
                <ul class="list-unstyled text-small">
                    <li><a class="text-muted" href="/contacts/">Контакты</a></li>
                    <li><a class="text-muted" href="/contacts/">Отзывы</a></li>
                    <li><a class="text-muted" href="/contacts/">Вакансии</a></li>
                    <li><a class="text-muted" href="/contacts/">Оплата</a></li>
                </ul>
            </div>
        </div>
    </footer>
<script src="/static/js/bootstrap.bundle.min.js"></script>
<nav aria-label="Page navigation example">
  <ul class="pagination">
    <li class="page-item"><a class="page-link" href="#">Предыдущий</a></li>
    <li class="page-item"><a class="page-link" href="#">1</a></li>
    <li class="page-item"><a class="page-link" href="#">2</a></li>
    <li class="page-item"><a class="page-link" href="#">3</a></li>
    <li class="page-item"><a class="page-link" href="#">Следующий</a></li>
  </ul>
</nav>
</body>
</html>
