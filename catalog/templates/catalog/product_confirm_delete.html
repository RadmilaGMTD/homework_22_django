<!-- product_confirm_delete.html -->
{% extends 'catalog/base.html' %}

{% block title %}Удалить товар{% endblock %}

{% block content %}
{% include 'catalog/header.html' %}
<h2>Удалить продукт</h2>
<p>Вы уверены, что хотите удалить "{{object.name}}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'catalog:product_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
