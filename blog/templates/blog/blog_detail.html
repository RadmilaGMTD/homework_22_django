{% extends 'blog/base_blog.html' %}
{% block title %}блог{% endblock %}
{% load my_tags %}
{% block content %}
<div class="container my-5">
        <div class="text-center">
            <img src="{{ blog.image | media_filter }}" class="img-fluid" alt="{{ blog.title }}" style="max-width: 400px; height: auto;">
        </div>
        <h2 class="text-center my-3">{{object.title}}</h2>
        <p class="text">Контент: {{object.content}}</p>
        <p class="text-center">Дата создания: {{object.created_at}}</p>
        <p class="text-center">Количество просмотров: {{object.views}}</p>
    <a href="{% url 'blog:blog_list' %}" class="btn btn-lg btn-primary mt-3">Назад</a>
    </div>
{% endblock %}
