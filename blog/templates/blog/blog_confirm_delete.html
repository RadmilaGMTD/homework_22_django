{% extends 'blog/base_blog.html' %}

{% block title %}Удалить статью{% endblock %}

{% block content %}
{% include 'blog/header_blog.html' %}
<h2>Удалить продукт</h2>
<p>Вы уверены, что хотите удалить "{{object.title}}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'blog:blog_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
